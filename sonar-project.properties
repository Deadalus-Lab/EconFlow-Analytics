# SonarQube Cloud - CI-BASED ANALYSIS configuration.
#
# THE FILENAME IS PART OF THE MODE, and choosing the wrong one fails silently.
# SonarQube Cloud has two analysis modes that read different files:
#
#   CI-based    reads THIS file. Needs a SONAR_TOKEN secret and a scanner step.
#   Automatic   reads `.sonarcloud.properties` and, in Sonar's own words,
#               "will ignore the parameters in your sonar-project.properties file".
#
# THE TWO MUST NEVER BOTH BE ENABLED. Sonar states that automatic analysis "is not
# intended to be used in conjunction with CI-based analysis", and that a CI-based
# analysis run against a project with automatic analysis still on "will fail and
# cause a failure in your build process". Automatic analysis is therefore turned
# OFF for this project, in Administration > Analysis Method.
#
# WHY CI-BASED WAS CHOSEN over the cheaper automatic mode, recorded because the
# first attempt went the other way. Automatic analysis cannot import a coverage
# report ("Code coverage information is not supported") and produces no analysis
# logs ("Analysis logs are unavailable"). A verdict with no log is exactly what
# this repository refuses everywhere else -- every gate here prints what it
# examined and against which floor -- and coverage becomes load-bearing the moment
# the wrappers stop being stubs. Choosing CI-based now also avoids a migration
# that must be sequenced by hand, where forgetting to disable automatic first
# breaks the build.
#
# ADVISORY, NOT A GATE. This analysis runs in its own workflow rather than as a
# leaf of ci.yml, and the distinction is structural: `ci-gate` requires EVERY job
# in ci.yml, so a sonar job placed there would silently become a required check.
# An app whose verdict this repository cannot force, and which cannot be made to
# fail on planted-bad input, is a second opinion. No third-party service is ever
# a required check here: one that quietly stops reporting would block every merge
# with nothing in this repository able to make it answer. ARCHITECTURE.md records
# that under "Decisions already made".

sonar.projectKey=Deadalus-Lab_EconFlow-Analytics
sonar.organization=deadalus-lab

sonar.sources=engine/src,backend/src
sonar.tests=engine/tests
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Coverage, produced by the workflow with pytest-cov. The path is relative to
# sonar.projectBaseDir, which the scanner step sets to the repository root.
sonar.python.coverage.reportPaths=engine/coverage.xml

# THE GENERATED TIER IS EXCLUDED, the same reasoning that keeps ruff off it: every
# file under generated/ is machine-written from the frozen artifacts by
# scripts/gen_schemas.py, so a finding there is a finding about the emitter's
# formatting, reported against a file no human will ever edit. The fix for a real
# defect in that tier is a change to the generator, which IS analysed.
sonar.exclusions=engine/src/econflow_engine/generated/**,engine/artifacts/**,engine/fixtures/**,.github/vale/styles/proselint/**
sonar.coverage.exclusions=engine/src/econflow_engine/generated/**
