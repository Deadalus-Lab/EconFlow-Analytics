# SPDX-License-Identifier: AGPL-3.0-only
#
# .vale.ini -- the instrument for the published register.
#
# "Professional, academic English" is a stated requirement of this project and it
# had nothing enforcing it. Every other property the repository cares about is
# checked by something; the prose was checked by whoever happened to read it.
# This closes that gap.
#
# THE DIVISION OF LABOUR WITH `typos`. Vale ships a spell checker and it is
# switched OFF below. Spelling here is `typos`'s job: it understands identifiers,
# code and file paths, and its exemption list is already curated against this
# tree with a reason recorded for every entry. Running two spell checkers would
# mean maintaining two dictionaries that disagree, and the first disagreement
# would be resolved by weakening one of them. Vale therefore checks REGISTER --
# how the prose sounds -- and nothing else.
#
# THE STYLE IS COMMITTED, NOT FETCHED. `.github/vale/styles/proselint` is vendored
# into the repository (BSD-3-Clause, from errata-ai/proselint) rather than pulled by
# `vale sync` at check time. A gate that needs the network to start is a gate
# that fails for reasons unconnected to the change being tested, and this one
# runs in the same job as tests that are meant to be reproducible offline.
#
# `.github/vale/styles/EconFlow` is this project's own, and each rule there states
# in its own header what it enforces and why. The styles live under `.github/`
# rather than at the root: the public root surface is a deliberate, reviewed list
# declared in `.github/root-manifest.txt` and asserted by check-root-visibility.sh,
# and a directory of vendored third-party rule files does not belong on it. No
# count is written here -- that manifest is the one place the surface is stated,
# and a copy of its size in a second file is a number that rots.

StylesPath = .github/vale/styles

# Only `error` fails the run. proselint raises a good deal at `suggestion` and
# `warning` that is worth reading and not worth blocking a merge over -- the
# register rules that are genuinely load-bearing are all declared `error`.
MinAlertLevel = error

Vocab = EconFlow

[*.md]
BasedOnStyles = EconFlow, proselint

# Spelling belongs to `typos`. See the note above.
Vale.Spelling = NO

# proselint's typographic rules argue with the notation. `x -- y` is an em dash
# written in ASCII on purpose, so that the source stays readable in a terminal
# and in a diff, and the ellipsis in a truncated code sample is three periods for
# the same reason.
proselint.Typography = NO
proselint.Annotations = NO

# NO MARKDOWN EXISTS UNDER wrappers/ TODAY, and the previous version of this note
# claimed otherwise in three ways at once: it said there were thirty category
# guides, named the artifact `method-cards.v1.json`, and credited gen_wrappers.py
# with rendering them. All three are false against the tree. Measured 2026-08-22:
#
#   find engine/src/econflow_engine/wrappers -name README.md | wc -l   -> 0
#   grep -c README engine/scripts/gen_wrappers.py                      -> 0
#
# The generator emits typed Python stubs and no Markdown at all; the categories
# number 46, not thirty, and the artifact lost its `.v1` suffix when versioned
# filenames were retired. README.md publishes the category count beside the
# command that measures it, so it is not restated here.
#
# THE SECTION STAYS, AND THE REASON IS THE RULE RATHER THAN THE FILES. Any
# Markdown that lands under this directory will be rendered output, and a
# register finding in rendered output cannot be acted on where it is reported:
# the next `--check` reverts the edit, and the real defect is in the card prose
# or in the renderer. Keeping the section costs nothing while the set is empty
# and states the rule the moment method prose is rendered here. It restricts
# scope; it does not report a verdict, so an empty set makes no gate vacuous.
[engine/src/econflow_engine/wrappers/**/*.md]
BasedOnStyles =
