# SPDX-License-Identifier: AGPL-3.0-only
#
# The engine's lint configuration. Kept beside the code it lints rather than in
# the workspace manifest, because the wrapper exemptions below are the engine's
# alone and must not silently apply to the backend.

line-length = 100
target-version = "py312"

# Machine-written from artifacts/node-specs.json on every build; linting it
# would only lint the emitter's formatting choices.
extend-exclude = ["src/econflow_engine/generated"]

# EVERY FAMILY HERE WAS MEASURED BEFORE IT WAS ENABLED, and the measurement is
# what decides the shape of the exemptions below. Run per family from `engine/`:
#
#     ruff check --select <FAMILY> --statistics src scripts tests
#
# Measured 2026-08-19 against the whole corpus, with ruff 0.16.3 (the workspace)
# and ruff 0.7.1 (the pin in ci.yml's py-lint job) reporting IDENTICAL counts for
# every family listed -- so nothing below depends on which of the two runs it:
#
#   NPY   0    PD    0    PTH   0    PLE   0     <- enabled outright, no exemption
#   S    61    T20  18    ARG   2    ERA   1     <- enabled, exemptions below
#   C90   4    PLR0913 350
#   TRY  85 (TRY003 82, TRY004 3)
#   PERF  2    PL (rest) 40                      <- NOT enabled; see the tail of
#                                                   this file for why and what
#                                                   has to happen first.
#
# The four numerical families are the point of the exercise: a wrapper body that
# compares a float with `==` (PD), reshapes with a deprecated numpy alias (NPY),
# or builds a path by string concatenation (PTH) is a defect this catches before
# a reviewer has to. They cost nothing today because there are no bodies yet --
# which is exactly when a rule is cheap to adopt.
[lint]
select = [
    "A",
    "ARG",
    "B",
    "C90",
    "E",
    "ERA",
    "F",
    "I",
    "NPY",
    "PD",
    "PERF",
    "PLE",
    "PLR0913",
    "PLR0917",
    "PTH",
    "S",
    "SIM",
    "T20",
    "TRY",
    "UP",
]

ignore = [
    # THE ENGINE'S REJECTION TYPE IS ValueError, DELIBERATELY AND EVERYWHERE:
    # `GateError` in errors.py subclasses it. Probed live against pydantic
    # 2.13.4 -- a ValueError raised inside a validator becomes a ValidationError
    # the wire layer can map to a reason code, while a TypeError propagates out
    # of the validation path as a crash. TRY004 asks for the second one whenever
    # the guard happens to be an isinstance check.
    "TRY004",
    # 82 findings, and every one of them is a message this project intends to
    # keep at the raise site. The wire contract carries the message VERBATIM to
    # the caller, so moving it into an exception class would either freeze one
    # phrasing per class or add 82 classes that exist only to hold a string.
    "TRY003",
]

[lint.per-file-ignores]
# A wrapper parameter name is not ours to choose: it is the argument name of the
# node contract. Two wrapper parameters are named `l` -- the vector of row sums of
# the interbank liabilities matrix, in `build_er_model` and
# `sample_interbank_network` -- and a one-letter `l` trips E741. Those two are the
# only E741 findings in the tier. Renaming the parameter would put the Python
# signature out of step with the wire contract the same file documents.
#
# THE BUILTIN SHADOWING IS THE CONTRACT, NOT AN OVERSIGHT. 199 wrapper parameters
# shadow a Python builtin -- `object` 92 times, `type` 75, then `vars`, `id` and
# `iter` 6 each, `format` 4, `filter` 3, `range` and `len` 2 each, and `min`,
# `max` and `open` once. Every one is the argument name of the node's wire
# contract, mechanically transliterated, and the same name appears in the JSON
# Schema, the generated argument model and the saved graphs. Renaming the Python
# parameter would put the signature out of step with the contract the same file
# documents, and would break every stored call.
#
# Only A002 (arguments) is exempted. A001 and A003 stay live here, because a
# shadowed local or attribute is ours to choose and is a real defect.
#
# Measured 2026-08-22 with ruff 0.16.3 -- the version run by run_verifications.sh
# and by ci.yml's py-lint job, which is now the single checker. Every one of the
# 199 is in the wrapper tier: the same command over `src scripts tests
# api-baseline` also reports 199, and 2 for E741.
#
#     ruff check src/econflow_engine/wrappers --isolated --select A002 --statistics
#     ruff check src/econflow_engine/wrappers --isolated --select E741 --statistics
#
# The count is a property of the tree and not of the linter, so it also falls out
# of a walk of the syntax tree:
#
#     python3 -c "import ast,builtins,pathlib as P;\
#     print(sum(a.arg in dir(builtins) for f in \
#     P.Path('src/econflow_engine/wrappers').rglob('*.py') \
#     for n in ast.walk(ast.parse(f.read_text())) if isinstance(n,ast.FunctionDef) \
#     for a in n.args.args+n.args.kwonlyargs))"
#
# PLR0913 is the same exemption for the same reason: 358 findings at the
# `max-args = 6` set below, and all 358 of them are in the wrapper tier. A node
# with fourteen arguments has a wrapper with fourteen parameters; that is the
# contract, not a function that grew.
#
#     ruff check src scripts tests api-baseline --isolated --select PLR0913 \
#         --config "lint.pylint.max-args=6" --statistics
"src/econflow_engine/wrappers/**/*.py" = ["A002", "E741", "PLR0913"]

# `assert` IS the test (60 findings), and test_cli.py must start the CLI as a
# real subprocess to prove the entry point works at all -- an in-process call
# would test everything except the thing that was broken. S603 flags every
# subprocess call whose arguments are not literals; here they are built from
# sys.executable and a fixed argv.
"tests/**/*.py" = ["S101", "S603"]

# The generators report their progress on stdout and are run by hand and by CI;
# printing is their interface, not a leftover debug statement (17 findings).
"scripts/*.py" = ["T201"]
# `run_write(plan, context)` is one of several commands called through a uniform
# (plan, context) signature; the parameter is required by the caller, not used
# by this one.
"scripts/gen_wrappers.py" = ["T201", "ARG001"]

# The CLI's whole job is to write to stdout.
"src/econflow_engine/__main__.py" = ["T201"]

# Same as the generators: this one is a gate invoked from run_verifications.sh
# and from CI, and what it prints -- the drifted signatures -- IS its report.
"api-baseline/check_api.py" = ["T201"]

# One finding, and it is a false positive: `# t.t == "op"` at formula.py:595 is
# an explanatory comment about the token that just matched, not code that was
# switched off. Scoped to this file so ERA001 stays live over the other 379.
"src/econflow_engine/formula.py" = ["ERA001"]

# `def _(value: None) -> None` is a functools.singledispatch registration: the
# parameter carries the dispatch type and cannot be renamed away or dropped.
"src/econflow_engine/serialize.py" = ["ARG001"]

[lint.mccabe]
# Fitted to the corpus, like the rest of this file. The four functions C901
# reports at the default 10 are the formula tokeniser, the authoring-to-wire
# adapter and two generator entry points, all measured at 11 or 12; none of them
# is mine to restructure and each is a flat dispatch rather than nested logic.
# 12 is therefore where the corpus already sits, and the rule now catches the
# thirteenth branch -- which is the growth this is meant to stop.
max-complexity = 12

[lint.pylint]
# The default 5 reports two functions outside the wrapper tier, both in gates.py,
# both at exactly 6 -- and in both the sixth parameter is a gate argument of the
# node contract (`gate_alpha`, `ordered`), the same reason PLR0913 is exempted
# for wrappers above. 6 is the measured ceiling outside the wrapper tier.
max-args = 6

[lint.isort]
known-first-party = ["econflow_engine"]

# ---------------------------------------------------------------------------
# MEASURED AND NOT ENABLED. Recorded here so the next reader does not have to
# repeat the measurement to find out why a family the numerical set calls for is
# missing. Neither is a judgement that the rule is wrong; both are blocked on a
# code change in a file this configuration cannot make for itself.
#
#   PERF  2 findings, both auto-fixable: PERF401 in scripts/gen_wrappers.py and
#         PERF403 in tests/parity/replay.py. Enabling the family before those
#         two lines are rewritten would mean suppressing two real findings, and
#         an ignore that hides a one-line fix is worse than an unenabled rule.
#
#   PL    beyond PLE and PLR0913: 40 findings that are genuine review material
#         rather than contract shape -- PLR2004 22 magic values, PLC0415 8
#         function-level imports, PLR0911/0912/0915 10 oversized functions,
#         PLW0603 1 global. Turning the family on today would take six global
#         ignores, which is not an enabled family; it is a disabled one wearing
#         its name.
#
#   PLR0917 (too-many-positional-arguments) is now ENABLED, and the reason it was
#         not is worth keeping. It is STABLE in 0.16.3 and PREVIEW in 0.7.1, and
#         this repository used to run BOTH -- 0.7.1 pinned in ci.yml's py-lint job,
#         0.16.3 resolved in uv.lock and used by run_verifications.sh. A rule that
#         fires on one of the two versions a repository runs is a rule set that
#         disagrees with itself, so the rule waited for the versions to agree
#         rather than the other way round. py-lint now installs the locked 0.16.3,
#         which is the version that certifies the image, and there is one checker
#         again. Measured before enabling: 0 findings over src, scripts, tests and
#         api-baseline, and the rule was confirmed live on a planted 7-positional
#         function so that the zero means "clean" rather than "did not run".
# ---------------------------------------------------------------------------
