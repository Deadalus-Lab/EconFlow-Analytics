# SPDX-License-Identifier: AGPL-3.0-only
name: Assert inventory
description: >-
  Re-measures the engine using the exact commands recorded in
  .github/inventory.json and fails if any figure differs. This is the
  anti-vacuity backstop: every other gate depends on it, so no gate can pass by
  having examined nothing.

inputs:
  engine-dir:
    description: Directory containing the engine (src/, scripts/, tests/, artifacts/).
    required: false
    default: "."
  manifest:
    description: Path to the inventory manifest, relative to the workspace root.
    required: false
    default: .github/inventory.json

runs:
  using: composite
  steps:
    - name: Re-measure and compare
      shell: bash
      env:
        ENGINE_DIR: ${{ inputs.engine-dir }}
        MANIFEST: ${{ inputs.manifest }}
      run: |
        set -euo pipefail
        bash "${GITHUB_ACTION_PATH}/assert.sh" "$ENGINE_DIR" "$MANIFEST"
