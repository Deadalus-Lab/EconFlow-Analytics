# SPDX-License-Identifier: AGPL-3.0-only
#
# The full engine suite.
#
# ---------------------------------------------------------------------------
# U55 -- WHERE THE FULL SUITE RUNS, AND WHAT THAT DOES NOT BUY
# ---------------------------------------------------------------------------
# Actions minutes are unlimited on public repositories, so cost is not the
# constraint. Latency is: a long required check on every pull request makes
# every pull request a long pull request.
#
# The compromise, stated plainly rather than presented as complete coverage:
#
#   pull request        a path-selected subset -- only the tests belonging to
#                       the wrappers the branch actually touched
#   push to main        the FULL suite, required
#   label `full-suite`  the full suite, opt-in, for a risky branch
#   nightly             the full suite plus full artifact regeneration
#
# WHAT THIS DOES NOT CLOSE, stated plainly because it is a real gap: a pull request
# touching a wrapper whose tests are not matched by the path selector can still
# merge green. The post-merge run turns that from "silently broken main" into
# "loudly broken main" -- which is a real improvement over nothing, and is NOT
# the same as per-pull-request protection.
name: engine-suite

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, labeled]
  schedule:
    # 03:17 UTC. Off the hour deliberately: the top of the hour is when every
    # scheduled workflow on the platform contends for runners.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: engine-suite-${{ github.ref }}
  cancel-in-progress: true

env:
  ENGINE_DIR: "engine"
  UV_VERSION: "0.10.10"
  # SINGLE-THREADED LINEAR ALGEBRA, for the same reason the image pins the
  # reference BLAS. NumPy's wheels ship a threaded OpenBLAS whose reduction
  # order depends on how work was split across threads, so a sensitive fit can
  # land on a different last bit from one run to the next on the SAME machine.
  # Pinning the thread count to one removes that source of variation. See
  # ARCHITECTURE.md 4.6.
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  # THE THREE ABOVE WERE NOT THE WHOLE SET, and the gap only bit on one path.
  # The `full` path runs run_verifications.sh, which re-exports all of these
  # itself; the `subset` path runs pytest DIRECTLY and so inherited only what is
  # declared here. It was therefore running with a live NUMEXPR pool and a
  # randomised hash seed while the full path was not -- two different numerical
  # environments behind one green tick. tests/test_thread_pinning.py now fails
  # loudly rather than letting that happen quietly.
  NUMEXPR_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"
  TZ: "UTC"
  LC_ALL: "C.UTF-8"
  LANG: "C.UTF-8"

jobs:
  # ---------------------------------------------------------------------------
  scope:
    name: decide what to run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      # EGRESS AUDIT, FIRST STEP OF EVERY JOB. The recent supply-chain attacks did
      # not break the build; they exfiltrated secrets over the network from a job
      # that otherwise went green. harden-runner records every outbound connection
      # this job makes, which is the only way to learn what the allowlist should
      # contain -- an allowlist written from imagination blocks the wrong things
      # and admits the rest. `audit` is therefore not a weaker setting than
      # `block`, it is the step that produces the input for it. See box 1.3.27.
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            mode=full
          elif ${{ contains(github.event.pull_request.labels.*.name, 'full-suite') }}; then
            mode=full
          else
            mode=subset
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "running the $mode suite"

  # ---------------------------------------------------------------------------
  suite:
    name: suite (${{ needs.scope.outputs.mode }})
    needs: scope
    runs-on: ubuntu-latest
    # Generous on purpose -- a timeout that trips on a slow runner teaches people
    # to ignore red.
    timeout-minutes: 150
    permissions:
      contents: read
      # The broken-main announcer calls `gh issue create`. Without this the
      # alarm fails on EVERY invocation with a permissions error -- and for a
      # long time that failure was hidden by a trailing `|| true`.
      issues: write
    steps:
      # EGRESS AUDIT, FIRST STEP OF EVERY JOB. The recent supply-chain attacks did
      # not break the build; they exfiltrated secrets over the network from a job
      # that otherwise went green. harden-runner records every outbound connection
      # this job makes, which is the only way to learn what the allowlist should
      # contain -- an allowlist written from imagination blocks the wrong things
      # and admits the rest. `audit` is therefore not a weaker setting than
      # `block`, it is the step that produces the input for it. See box 1.3.27.
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: engine/.python-version

      # ---------------------------------------------------------------------
      # A KNOWN AND DELIBERATE COMPROMISE, recorded rather than glossed over.
      #
      # ARCHITECTURE.md 4.6 pins the numerical backend because an optimised,
      # multithreaded one perturbs results enough to change output. Here that is
      # done with thread-count environment variables, which removes the
      # thread-order variation but NOT the difference between one BLAS build and
      # another: a runner's NumPy wheel carries whatever OpenBLAS it was built
      # against. So this job checks whether the suite passes, but NOT that it
      # produces the pinned numbers.
      #
      # The authoritative run is the one inside the engine image, where the
      # backend is fixed and the suite is a build gate. Once that image is
      # published, this workflow should run IN it (container:) and this
      # compromise disappears. Until then, do not read a green run here as proof
      # of numerical reproducibility.
      # ---------------------------------------------------------------------
      - name: Install uv at the pinned version
        run: python3 -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

      # ONE LOCKFILE, AT THE WORKSPACE ROOT. engine/ and backend/ are two members
      # of one uv workspace, so a single resolution covers both and they cannot
      # land on different builds of a shared dependency. `--locked` refuses to
      # re-resolve: if the lockfile does not already satisfy the manifests, this
      # fails instead of quietly installing something else.
      - name: Restore the locked environment
        run: uv sync --locked --all-extras

      - name: Full suite
        if: needs.scope.outputs.mode == 'full'
        working-directory: ${{ env.ENGINE_DIR }}
        run: ./run_verifications.sh

      - name: Path-selected subset
        if: needs.scope.outputs.mode == 'subset'
        working-directory: ${{ env.ENGINE_DIR }}
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          # THE PATHSPECS BELOW ARE CWD-RELATIVE, AND THAT IS LOAD-BEARING.
          # This step sets `working-directory: engine`, and git pathspecs resolve
          # against the current directory, not the repository root. So the
          # correct form is 'src/**/*.py'. The seemingly more explicit
          # 'engine/src/**/*.py' matches NOTHING from here -- the subset would be
          # empty, the job would exit 0, and a green run would mean the selector
          # found no changes rather than that the changes passed. Reproduce both
          # halves from engine/ on any commit that touched a wrapper:
          #   git diff --name-only HEAD~1 HEAD -- 'src/**/*.py'         # matches
          #   git diff --name-only HEAD~1 HEAD -- 'engine/src/**/*.py'  # empty
          mapfile -t changed < <(git diff --name-only "$base" "$head" -- 'src/**/*.py' || true)
          echo "changed Python sources: ${#changed[@]}"

          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No engine sources changed. The full suite runs post-merge regardless."
            exit 0
          fi

          # Map each changed module to the test file that covers it, by basename.
          sel=()
          for f in "${changed[@]}"; do
            b="$(basename "$f" .py)"
            if [ "$b" = "__init__" ]; then
              continue
            fi
            while IFS= read -r t; do
              sel+=("$t")
            done < <(find tests -name "test_*${b}*.py" -not -path '*__pycache__*')
          done

          if [ "${#sel[@]}" -eq 0 ]; then
            # HONEST FAILURE MODE. Changed sources with no matching test file is
            # exactly the gap 11.4 describes. Say so loudly rather than exiting
            # green and letting the silence read as coverage.
            echo "::warning::${#changed[@]} engine source(s) changed but no test file matched by basename."
            echo "::warning::This pull request is NOT covered by the subset run. The full suite runs post-merge."
            exit 0
          fi

          printf 'selected %d test file(s)\n' "${#sel[@]}"
          printf '  %s\n' "${sel[@]}"
          uv run --locked pytest "${sel[@]}"

      - name: The suite inside the image, on an uncached build
        if: needs.scope.outputs.mode == 'full'
        run: |
          set -euo pipefail
          # THE AUTHORITATIVE RUN OF run_verifications.sh, and the guarantee the
          # image build used to carry. It moved here for one measured reason: a
          # `RUN ./run_verifications.sh` on the default build path can be
          # satisfied from a cached layer, so it reports success having executed
          # nothing. That is the vacuous-gate shape ARCHITECTURE.md 11.1 refuses,
          # and through BuildKit it arrives without anybody weakening a single
          # assertion. Docker's own guidance is a separate stage invoked on
          # demand, run with --no-cache.
          #
          # `--target test` selects the stage that runs the suite; nothing else
          # depends on it, so the runtime build below never enters it.
          # `--no-cache` is the half that makes the run real -- without it this
          # step is the same cached lie in a different place.
          # `--progress=plain` keeps the suite's own output in the log, so a
          # reader can see which of the thirteen steps ran.
          docker build --target test --no-cache --progress=plain .

      - name: Build the image and score it with dockle
        if: needs.scope.outputs.mode == 'full'
        env:
          DOCKLE_VERSION: "0.4.15"
        run: |
          set -euo pipefail
          # WHY HERE AND NOT IN ci.yml. The image build runs the full verification
          # suite as a hard gate, and the full suite is deliberately kept off every
          # pull request -- it would make every pull request as long as the suite.
          # This job is already the long one, so the image
          # scan belongs beside it: on push to main, nightly, and on a branch that
          # opts in with the full-suite label.
          # The epoch comes from the commit, so the same commit always builds the
          # same bytes. See the note at the top of the Dockerfile for the measured
          # byte-for-byte comparison and how to reproduce it.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          docker build --target runtime -t econflow-engine:ci .

          base="https://github.com/goodwithtech/dockle/releases/download/v${DOCKLE_VERSION}"
          curl -sSfL "${base}/dockle_${DOCKLE_VERSION}_Linux-64bit.tar.gz" -o dockle.tgz
          tar -xzf dockle.tgz dockle && chmod +x dockle

          # TWO SUPPRESSIONS, BOTH MEASURED, NEITHER OF THEM A CONVENIENCE.
          #
          # -af settings.py: CIS-DI-0010 is a filename heuristic, and what it found
          # is scipy's own
          # .venv/lib/python3.12/site-packages/scipy/_external/cobyqa/settings.py.
          # It holds solver tolerances, not a credential.
          #
          # -i DKL-DI-0005: the uncleaned apt cache it reports is in the BASE
          # IMAGE's own layer -- the one installing ca-certificates, netbase and
          # tzdata, which python:3.12-slim ships and this repository cannot rewrite.
          # Our own apt layer installs libglpk40, libgmp10, libmpfr6 and tini and
          # ends with `rm -rf /var/lib/apt/lists/*`. Verified by reading both.
          ./dockle --exit-code 1 --exit-level fatal \
            -af settings.py -i DKL-DI-0005 econflow-engine:ci

      - name: The image size stays between its floor and its ceiling
        if: needs.scope.outputs.mode == 'full'
        run: |
          set -euo pipefail
          # BOTH BOUNDS, AND THE FLOOR IS NOT DECORATION. A ceiling on its own
          # passes on an image that never built and inspects as 0 bytes -- the
          # gate-that-examined-nothing shape this repository refuses everywhere
          # else. The floor is the half that says a real image was measured.
          #
          # READ WITH NO DEFAULT. `d["image"]["ceiling_bytes"]` raises KeyError if
          # the section is missing, and the step fails there. A `.get(..., 2**30)`
          # would let a deleted manifest section read as a passing gate against a
          # number nobody reviewed. .github/inventory.json explains why an `image`
          # section is inert in assert-inventory/assert.sh and measured here.
          read -r ceiling floor < <(python3 -c "
          import json
          d = json.load(open('.github/inventory.json'))['image']
          print(int(d['ceiling_bytes']), int(d['floor_bytes']))
          ")
          size=$(docker image inspect econflow-engine:ci --format '{{.Size}}')

          printf 'image size %s bytes (floor %s, ceiling %s)\n' "$size" "$floor" "$ceiling"
          if [ "$size" -lt "$floor" ]; then
            echo "::error::the image is $size bytes, below the $floor-byte floor."
            echo "A figure this small means the build produced no engine, not that"
            echo "the image got smaller. Read the build log before touching the floor."
            exit 1
          fi
          if [ "$size" -gt "$ceiling" ]; then
            echo "::error::the image is $size bytes, above the $ceiling-byte ceiling."
            echo "Galaxy pulls this image once per job. Find what was added -- a new"
            echo "dependency tree, an un-pruned build stage -- or raise the ceiling in"
            echo ".github/inventory.json in a reviewed one-line diff that says why."
            exit 1
          fi

      - name: The image runs on a read-only root filesystem
        if: needs.scope.outputs.mode == 'full'
        run: |
          set -euo pipefail
          # A read-only rootfs is a RUNTIME property, so it cannot be proven by
          # building. tini and the entrypoint need somewhere writable, which is
          # what the tmpfs is for; without it this fails at start rather than at
          # build, and the failure would otherwise surface only when Galaxy ran a
          # real job.
          docker run --rm --read-only --tmpfs /tmp econflow-engine:ci \
            python -m econflow_engine --version
          uid=$(docker run --rm --read-only --tmpfs /tmp econflow-engine:ci id -u)
          [ "$uid" = "10001" ] || { echo "::error::the container runs as uid $uid, not 10001"; exit 1; }
          echo "the image runs read-only as uid $uid"

      - name: Announce a broken main loudly
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "broken main: engine suite failed on $(git rev-parse --short HEAD)" \
            --label broken-main \
            --body "The full engine suite failed on a push to main.

          Commit: ${{ github.sha }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This is the failure mode the path-selected subset leaves open by
          design: a pull request whose tests were not matched by the selector
          merged green and broke the engine. The post-merge full suite exists to
          turn that from a silently broken main into a loud one, which is what
          just happened. Fix forward or revert." || {
            echo "::error::FAILED TO ANNOUNCE A BROKEN MAIN."
            echo "The engine suite failed AND the alarm could not be raised."
            echo "Check that the 'broken-main' label exists and that this job has"
            echo "issues: write. An announcer that fails silently is worse than no"
            echo "announcer, because it looks like one."
            exit 1
          }

  # ---------------------------------------------------------------------------
  # BOX 2.1.17 -- MUTATION TESTING. NIGHTLY (and on demand), NEVER ON A PULL REQUEST.
  #
  # WHY IT IS A SEPARATE JOB AND NOT A run_verifications.sh LEAF. mutmut rebuilds
  # the tree under mutants/ and re-runs the suite once per mutant: minutes,
  # against the three seconds the correctness gate takes. Putting it in the
  # verification script would make every local run and every image build pay that
  # cost, and a gate people start skipping is not a gate.
  #
  # AND IT MUST NEVER BECOME A ci-gate LEAF. ci-gate asserts EXACTLY 12 results at
  # ci.yml:1685 and check-required-contexts.sh cross-checks that needs list, so a
  # thirteenth required context would turn ci-gate red on arrival. This job lives
  # in engine-suite.yml, which ci-gate does not aggregate, and is deliberately NOT
  # added to any required-contexts list.
  #
  # `continue-on-error` ON THE TWO MEASURING STEPS IS DELIBERATE AND IS NOT A
  # SOFTENED GATE. The kill rate over serialize.py and chart_spec.py is low today
  # and is recorded honestly as such; this job exists to MEASURE and REPORT it
  # nightly, and a red cron nobody can act on until the 2.2 bodies land would
  # train people to ignore the nightly. The assertions inside mutation_gate.py
  # are real and its output is read. The positive control below carries NO
  # continue-on-error: if the gate ever stops refusing a zero-mutant run, this
  # job fails outright. Delete the two lines when the floor is worth blocking on.
  mutation:
    name: mutation testing (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      # EGRESS AUDIT, FIRST STEP OF EVERY JOB. See the note in `scope` above.
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: engine/.python-version

      - name: Install uv at the pinned version
        run: python3 -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

      - name: Restore the locked environment
        run: uv sync --locked --all-extras

      # THE TARGET LIST LIVES IN .github/inventory.json, NOT HERE, and one of its
      # three entries does not exist yet: gates/primitives.py is being written in
      # a separate worktree. Naming it now means the coverage lands with that
      # merge instead of being remembered afterwards. An absent target is
      # REPORTED AND SKIPPED; ALL THREE absent is a hard failure, because that
      # means the paths are wrong rather than the tree being early.
      - name: Report which mutation targets exist
        working-directory: ${{ env.ENGINE_DIR }}
        run: |
          set -euo pipefail
          present=0
          while IFS= read -r target; do
            if [ -f "$target" ]; then
              echo "present  $target"
              present=$((present + 1))
            else
              echo "::notice::mutation target not in the tree yet, skipped: $target"
            fi
          done < <(python3 -c "import json;print('\n'.join(json.load(open('../.github/inventory.json'))['mutation']['targets']))")
          [ "$present" -gt 0 ] || {
            echo "::error::not ONE mutation target exists. The paths in"
            echo "mutation.targets are wrong, not the tree. A run over no target"
            echo "generates no mutants and would score 100 % for testing nothing."
            exit 1
          }
          echo "$present mutation target(s) present"

      - name: Run mutmut over the configured targets
        working-directory: ${{ env.ENGINE_DIR }}
        continue-on-error: true
        run: uv run --locked mutmut run

      # `export-cicd-stats` EXITS 0 WITHOUT WRITING ITS FILE when no run has
      # happened, printing "No previous mutation data found" -- so its exit
      # status proves nothing and mutation_gate.py reads the FILE instead.
      - name: Export the stats and assert the floors
        working-directory: ${{ env.ENGINE_DIR }}
        continue-on-error: true
        run: |
          set -euo pipefail
          uv run --locked mutmut export-cicd-stats
          cat mutants/mutmut-cicd-stats.json
          uv run --locked python -m tests.controls.mutation_gate

      # THE ANTI-VACUITY CONTROL, RUN EVERY NIGHT AND NOT ONCE BY HAND.
      # Points the gate at stats describing zero mutants and requires it to FAIL.
      # 0 killed of 0 generated is the shape that reads as a perfect score for
      # having tested nothing, and the only way to know this gate still refuses
      # it is to make it refuse one on every run.
      - name: Positive control -- a zero-mutant run MUST be refused
        working-directory: ${{ env.ENGINE_DIR }}
        run: |
          set -euo pipefail
          empty="${RUNNER_TEMP}/zero-mutants.json"
          printf '{"killed": 0, "survived": 0, "total": 0}\n' > "$empty"
          if uv run --locked python -m tests.controls.mutation_gate "$empty"; then
            echo "::error::the mutation gate ACCEPTED a run of 0 mutants."
            echo "That is the vacuous measurement it exists to refuse: 0 killed of"
            echo "0 generated is not a 100 % kill rate, it is a missing measurement."
            exit 1
          fi
          echo "positive control fired: a 0-mutant run was refused, as it must be"
