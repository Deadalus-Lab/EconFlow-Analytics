# SPDX-License-Identifier: AGPL-3.0-only
#
# Claude, on demand: mention @claude in an issue or a pull-request comment.
#
# THIS IS NEVER A REQUIRED CHECK. Three independent reasons, each sufficient:
#
#   1. It is non-deterministic. A required check that can answer differently on
#      a re-run is a coin flip, not a gate -- and this project's central claim
#      (ARCHITECTURE.md 1) is that correctness is STRUCTURAL, not probabilistic.
#      A probabilistic gate on the release path would contradict the product.
#   2. It depends on a third-party API. An outage would block every release.
#   3. It cannot run on pull requests from forks, which receive no secrets.
#      Making it required would permanently block outside contributors --
#      against 11's "open source from its first commit".
#
# Claude reviews and assists. The deterministic gates in ci.yml decide what is
# correct.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  # Keyed on the issue or PR, so a burst of comments does not fan out into
  # concurrent runs all drawing on the same subscription token.
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    # Two guards, both necessary.
    #
    # The mention guard is obvious. The author_association guard is the one that
    # matters: without it, ANY passer-by on a public repository could invoke a
    # paid API by typing @claude in a comment. Public repositories are exactly
    # where that gets discovered.
    if: >-
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'COLLABORATOR' ||
        github.event.review.author_association == 'OWNER' ||
        github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read   # so it can read a failed run's logs when asked to
    steps:
      # EGRESS AUDIT, FIRST STEP OF EVERY JOB. See the note in ci.yml and box 1.3.27.
      # These two workflows write to the repository under the maintainer's token,
      # which makes their egress the most worth recording, not the least.
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Claude
        uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1
        with:
          # THE SUBSCRIPTION TOKEN, NOT AN API KEY. Both are accepted by this action
          # -- `claude_code_oauth_token` is documented at the pinned SHA as an
          # alternative to `anthropic_api_key` -- and the token was chosen so the
          # repository does not carry a second billing relationship for a check
          # that is never required. Mint it with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Commits and comments are authored in English, in a professional and
          # academic register, and attributed to the maintainer.
          #
          # An honest limit, recorded rather than pretended away: a GitHub App's
          # comments always render under the App's name. Full identity masking
          # is not achievable. What IS controllable is commit author metadata
          # and the language and register of the text, and both are set here.
          claude_args: >-
            --system-prompt
            "Write in English, in a professional academic register.
             Never use casual phrasing in anything a stranger will read.
             When you commit, author as Panagiotis-Tsikos
             <316596317+Panagiotis-Tsikos@users.noreply.github.com>.

             This repository is an econometric compute engine whose central
             claim is that correctness is structural, not probabilistic. Hold
             to it: never weaken a gate to make something pass, never soften a
             stop() into a warning, never hand-edit a generated artifact under
             artifacts/, and never add a skip() to silence a failing test.

             If you cannot verify a claim, say so rather than asserting it."
