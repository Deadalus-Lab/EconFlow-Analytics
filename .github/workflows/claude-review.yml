# SPDX-License-Identifier: AGPL-3.0-only
#
# Automatic review on every pull request from a branch in this repository.
#
# ADVISORY ONLY -- never a required check. See claude.yml for the three reasons.
#
# ---------------------------------------------------------------------------
# THE FORK GUARD, AND WHY IT IS NOT `pull_request_target`
# ---------------------------------------------------------------------------
# `pull_request` on a fork gives an empty secret, so this job would fail with no
# credential. The usual "fix" is to switch the trigger to `pull_request_target`,
# which DOES expose secrets. That is a serious mistake here: it runs with write
# permissions in the context of the BASE repository while checking out code an
# untrusted contributor wrote. It is the standard route to exfiltrating a
# repository's secrets, and this repository is public.
#
# So the job is skipped on fork pull requests, deliberately and permanently.
# Outside contributors still get CodeRabbit -- which works on forks through its
# own app rather than through our secrets -- and every deterministic gate in
# ci.yml. They do not get this one. The trade is stated here rather than left to
# be discovered: a fork pull request seeing no review comment from this workflow
# is the design working, not a job that failed to run.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      # EGRESS AUDIT, FIRST STEP OF EVERY JOB. See the note in ci.yml and box 1.3.27.
      # These two workflows write to the repository under the maintainer's token,
      # which makes their egress the most worth recording, not the least.
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Review
        uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1
        with:
          # THE SUBSCRIPTION TOKEN, NOT AN API KEY. Both are accepted by this action
          # -- `claude_code_oauth_token` is documented at the pinned SHA as an
          # alternative to `anthropic_api_key` -- and the token was chosen so the
          # repository does not carry a second billing relationship for a check
          # that is never required. Mint it with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # allowed_tools deliberately EXCLUDES anything that could run
          # run_verifications.sh or a generator in --check mode.
          #
          # Claude reviews; CI proves. If a model could run the suite and report
          # the result, the report would become the evidence -- and the evidence
          # would be non-deterministic. The suite's verdict must come from the
          # gate, not from a summary of the gate.
          claude_args: >-
            --allowed-tools "Read,Grep,Glob"
            --system-prompt
            "Review this pull request for an econometric compute engine.
             Write in English, in a professional academic register.

             Check, in order of importance:

             1. GATES. Every documented requirement of a method must be an
                explicit refusal to compute, never a warning and never silent.
                Flag any gate that was softened, deleted, or made conditional.
             2. TESTS. Flag any test weakened rather than fixed: a skip or xfail
                added to make a failure go away, a loosened assertion, a deleted
                pytest.raises, or a mutation-proof check replaced by a shape
                check. A test that no longer distinguishes right from wrong is
                worse than no test, because it reports success.
             3. WRAPPER ANATOMY. Each src/econflow_engine/wrappers/**/*.py
                module: arguments only from the upstream documentation with
                their documented defaults; a structured result out, never
                printing and never plotting; examples in the docstring rather
                than at module scope; an implementation-note footer recording
                functions used, what was omitted and the gates added.
             4. GENERATED CODE. Nothing under artifacts/ may be hand-edited, and
                nothing under src/econflow_engine/generated/ either -- that tier
                is re-emitted by scripts/gen_schemas.py on every build. If a
                generator or its input changed and the generated tier did not,
                say so.
             5. SECURITY. No network call in any wrapper (the engine makes none,
                enforced by the no-network gate). No eval, exec or pickle on user input. No getattr
                resolving a user-supplied name to a callable. No stochastic
                method without a mandatory seed. No chart rendered in the
                engine: it emits chart DATA, the browser draws.
             6. THE ENGINE BOUNDARY. No statistical dependency may appear in
                backend/. numpy, scipy, statsmodels, pandas and pyarrow belong
                to engine/ alone. This used to be guaranteed by the file
                extension and is now only a CI check, so it is worth a human
                eye as well.
             7. DETERMINISM. Nothing that would make the same input produce a
                different number -- in particular, no change to the locked
                dependency set and no change to the linear-algebra thread
                settings that pin every BLAS pool to one.

             Report only what you can point at with a file and line. If you are
             uncertain whether something is a defect, say that you are uncertain
             and explain what would settle it. Do not pad the review with
             observations that carry no consequence."
