# SPDX-License-Identifier: AGPL-3.0-only
#
# SonarQube Cloud, CI-based analysis.
#
# THIS IS ITS OWN WORKFLOW, AND THAT IS STRUCTURAL RATHER THAN TIDY.
# `ci-gate` in ci.yml requires EVERY other job in that file -- check-required-contexts.sh
# asserts it as a set comparison -- so a sonar job placed in ci.yml would silently
# become a required check. This app is ADVISORY: its verdict cannot be forced by
# this repository and it cannot host a positive control, so it must never decide
# whether a change may merge. No third-party service is ever a required check
# here, a decision ARCHITECTURE.md records under "Decisions already made".
# Keeping this job in a separate file is what makes that true rather than merely
# intended.
#
# It is also why a failure here is not a broken build. The deterministic gates in
# ci.yml decide what is correct; this reports a second opinion beside them.
name: sonar

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same numerical environment every other engine job declares. Measured
  # rather than assumed: a bare `pytest` here fails tests/test_thread_pinning.py
  # outright, because the thread pins are read at library load time and this job
  # runs the suite to produce a coverage report.
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"
  TZ: "UTC"
  LC_ALL: "C.UTF-8"
  LANG: "C.UTF-8"

jobs:
  analysis:
    name: sonar (advisory, never required)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Sonar's own instruction: "Shallow clones should be disabled for a
          # better relevancy of analysis". Blame and new-code detection both read
          # history, and a depth-1 clone has none.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: engine/.python-version

      - name: Install uv at the pinned version
        env:
          UV_VERSION: "0.10.10"
        run: python3 -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

      - name: Restore the locked environment
        run: uv sync --locked --all-extras

      - name: The suite, with a coverage report
        working-directory: engine
        run: |
          set -euo pipefail
          # Coverage is the reason this analysis is CI-based at all: automatic
          # analysis states plainly that "Code coverage information is not
          # supported". No floor is asserted on the figure, deliberately -- the
          # 598 wrappers are typed stubs that raise, so a percentage today
          # describes the harness and not the catalogue. A floor lands with the
          # first real bodies.
          uv run --project .. pytest -q \
            --cov=econflow_engine --cov-report=xml:coverage.xml
          test -s coverage.xml || { echo "::error::no coverage report was produced"; exit 1; }
          echo "coverage report written: $(wc -c < coverage.xml) bytes"

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Pinned like every other tool here. The action would otherwise track
          # its own default, which moves without any change to this repository.
          scannerVersion: 8.1.0.6389
          # GPG verification of the downloaded scanner stays ON. The input exists
          # to disable it; it is named here so that a future edit turning it off
          # is a visible, reviewable line rather than a silent default.
          skipSignatureVerification: "false"
